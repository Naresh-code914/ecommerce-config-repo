
# Application
spring.application.name=sms-service
server.port=8085

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Message Central
message-central.base-url=https://cpaas.messagecentral.com
message-central.customer-id=${MESSAGE_CENTRAL_CUSTOMER_ID}
message-central.password=${MESSAGE_CENTRAL_PASSWORD}
message-central.country=91
message-central.email=${MESSAGE_CENTRAL_EMAIL}
message-central.otp-length=6

# SMS configuration
message-central.sender-id=${MESSAGE_CENTRAL_SENDER_ID}
message-central.message-type=TRANSACTION
